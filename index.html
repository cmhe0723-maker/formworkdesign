<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模板與支撐系統分析與設計程式</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f2;--panel:#fff;--ink:#1d2329;--sub:#5d6670;--line:#dde1dc;--soft:#eef0ec;--accent:#1f4e79;--V:#2563a8;--M:#b4441f;--D:#2f7d4f;--R:#6b3fa0;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans','Noto Sans TC','Noto Sans Thai',system-ui,sans-serif;font-size:14px}
header{padding:14px 20px 10px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
header h1{font-size:19px;margin:0;font-weight:700}
header .tag{color:var(--sub);font-size:12.5px}
header .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header .right select{width:auto}
main{display:grid;grid-template-columns:minmax(400px,480px) 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:1080px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .num{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;flex:none}
.panel h2 .sp{margin-left:auto}
.inputs{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
@media(max-width:1080px){.inputs{position:static;max-height:none}}
label.f{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--sub);min-width:0}
input[type=number],select{font:inherit;font-size:13px;padding:5px 6px;border:1px solid #c9cec8;border-radius:6px;background:#fff;color:var(--ink);width:100%;min-width:0}
input[type=number]{font-family:var(--mono)}
input:focus,select:focus{outline:2px solid #9cc0e4;border-color:var(--accent)}
.span-card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fbfbfa}
.span-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:500}
.span-card .hd .info{margin-left:auto;font-size:11.5px;color:var(--sub);font-family:var(--mono)}
.span-card details{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.span-card summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:500}
.g{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.mt{margin-top:8px}
button{font:inherit;font-size:13px;border:1px solid #c9cec8;background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--ink)}
button:hover{background:var(--soft)}
button.x{border:none;background:none;color:#a33;font-size:16px;padding:2px 6px;line-height:1}
button.x:hover{background:#fbeaea}
.seg{display:inline-flex;border:1px solid #c9cec8;border-radius:7px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--accent);color:#fff}
table.rows{width:100%;border-collapse:collapse}
table.rows th{font-size:11.5px;color:var(--sub);font-weight:500;text-align:left;padding:2px 3px}
table.rows td{padding:3px 3px;vertical-align:middle}
table.rows td.idx{color:var(--sub);font-family:var(--mono);font-size:12px;width:22px}
table.rows select.case{width:62px}
.empty{color:var(--sub);font-size:12px;padding:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .k{font-size:12px;color:var(--sub)}
.card .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:2px}
.card .s{font-size:11.5px;color:var(--sub);font-family:var(--mono)}
.viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.viewbar select{width:auto;max-width:100%}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 6px;margin-bottom:12px}
.chart .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.chart .hd b{font-size:14.5px}
.chart .hd span{font-size:12px;color:var(--sub)}
.chart svg{width:100%;height:auto;display:block}
.chart svg.hov{cursor:crosshair}
.readout{position:sticky;top:0;z-index:5;background:#1d2329;color:#e9edf1;border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:12.5px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px 18px;min-height:32px;align-items:center}
.readout .lab{color:#95a1ad}
.err{background:#fdecea;border:1px solid #f1b0a8;color:#8a1f12;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:none}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
table.tbl th{color:var(--sub);font-weight:500;background:#fafaf8}
table.tbl td:first-child,table.tbl th:first-child{text-align:left}
table.tbl td{font-family:var(--mono)}
table.tbl td.t{font-family:inherit}
.tblwrap{overflow-x:auto}
.note{font-size:12.5px;color:var(--sub);line-height:1.7}
.note b{color:var(--ink)}
details.help summary{cursor:pointer;font-weight:500}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
.muted{color:var(--sub)}
.ok{color:#2f7d4f;font-weight:600}.bad{color:#b4441f;font-weight:600}
.bar{height:6px;background:#eceee9;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
.dspan{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.dspan .dh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fafaf8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dspan .dh b{font-size:14px}
.dspan .dh .badge{margin-left:auto;padding:2px 10px;border-radius:12px;font-size:12.5px;font-weight:600}
.badge.ok{background:#e3f2e8;color:#226339}.badge.bad{background:#fbe5dd;color:#9b3415}.badge.na{background:#eef0ec;color:#5d6670}
.dspan table.tbl td,.dspan table.tbl th{padding:5px 10px}
.dspan details{padding:6px 12px 10px;font-size:12.5px}
.dspan details summary{cursor:pointer;color:var(--accent)}
.dspan details div{font-family:var(--mono);font-size:12px;line-height:1.75;color:#39424b}
.warn{color:#9b3415;font-size:12.5px;padding:4px 12px 8px}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}button.pri:hover{background:#173d61}button:disabled{opacity:.5;cursor:wait}
.ovl{position:fixed;inset:0;background:rgba(20,26,32,.45);z-index:50;display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:12px;padding:18px 20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 12px;font-size:16px}
input[type=text]{font:inherit;font-size:13px;padding:5px 7px;border:1px solid #c9cec8;border-radius:6px;width:100%}
.fwrap{position:relative}
#fileBtn{font-weight:600}
#fileMenu{display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;min-width:280px;z-index:40}
#fileMenu.open{display:block}
#fileMenu .mi{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;border:none;background:none;text-align:left;padding:7px 10px;border-radius:6px}
#fileMenu .mi:hover{background:var(--soft)}
#fileMenu .mi.sub{padding-left:30px;font-size:12.5px;color:#39424b}
#fileMenu kbd{font-family:var(--mono);font-size:11px;color:var(--sub)}
#fileMenu .mh{padding:6px 10px 2px;font-size:12.5px;font-weight:600;color:var(--sub)}
#fileMenu .msep{height:1px;background:var(--line);margin:5px 4px}
#fileMenu .mnote{font-size:11.5px;color:var(--sub);padding:6px 10px 4px;line-height:1.5;max-width:320px}
#docName{font-family:var(--mono);font-size:12.5px;color:var(--sub);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2329;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;transition:opacity .3s;opacity:0;pointer-events:none;max-width:90vw}
#toast.bad{background:#9b3415}
.catbox{margin-top:8px;background:#f1f5f9;border:1px solid #d7dee6;border-radius:6px;padding:7px 9px;font-size:12px;font-family:var(--mono);line-height:1.6;color:#2b3640}
#tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;padding:9px 18px;font-size:14px;font-weight:600;background:#f4f5f2;color:var(--sub);display:flex;align-items:center;gap:8px;margin-bottom:-1px;white-space:nowrap}
#tabs button.on{background:var(--bg);color:var(--accent);border-color:var(--line);box-shadow:inset 0 3px 0 var(--accent)}
#tabs .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#dfe4ea;color:#39424b;font-size:12px}
#tabs button.on .n{background:var(--accent);color:#fff}
#tabs .st{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:10px}
#tabs .st.ok{background:#e3f2e8;color:#226339}#tabs .st.bad{background:#fbe5dd;color:#9b3415}
#tabNote{padding:8px 20px 0;font-size:12.5px;color:var(--sub)}
#tabs .n.ic{background:none;width:auto;font-size:15px}
#pageWrap .pnote{max-width:820px;margin:0 auto 10px;font-size:12.5px;color:var(--sub)}
.paper{background:#fff;max-width:820px;margin:0 auto;aspect-ratio:210/297;box-shadow:0 4px 18px rgba(0,0,0,.10);border:1px solid var(--line);position:relative;padding:7% 9%}
.paper.cover::before{content:'';position:absolute;inset:3%;border:4px solid var(--accent);pointer-events:none}
.paper.cover::after{content:'';position:absolute;inset:calc(3% + 10px);border:1px solid var(--accent);pointer-events:none}
.paper .ctitle{white-space:pre-line;margin-top:20%;text-align:center;font-size:clamp(22px,3.4vw,36px);font-weight:700;line-height:1.45;color:#1d2329}
.paper .cbar{width:36%;height:4px;background:var(--accent);margin:22px auto 0}.paper .cbar.sm{width:20%;margin-top:14px}
.paper .cfields{margin:22% auto 0;width:78%;position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:26px;align-items:end}
.paper .crow{display:contents;font-size:clamp(14px,1.8vw,19px);font-weight:700}.paper .crow span{font-size:clamp(14px,1.8vw,19px);font-weight:700;white-space:nowrap}
.paper .crow input{border:none;border-bottom:1.5px solid #9aa3ab;border-radius:0;font-size:clamp(14px,1.8vw,19px);padding:4px 2px;background:transparent;width:100%;font-family:inherit}
.paper .crow input:focus{outline:none;border-bottom-color:var(--accent);background:#f3f7fb}
.paper .cfoot{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:12px;color:#7a838c}
.paper.toc .ttitle{text-align:center;font-size:clamp(22px,3vw,32px);font-weight:700;margin-top:4%}
.tlist{margin-top:9%}.thead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.trow{display:flex;align-items:baseline;gap:8px;font-size:clamp(15px,1.9vw,20px);font-weight:700;margin:16px 0}
.trow.sub{font-weight:400;color:var(--sub);font-size:clamp(13px,1.6vw,16px);margin:8px 0}
.attwrap{max-width:900px;margin:0 auto}
.drop{border:2px dashed #9cc0e4;border-radius:12px;background:#f6f9fc;padding:26px;text-align:center;color:#1f4e79;font-weight:500;cursor:pointer;margin-bottom:12px}
.drop.over{background:#e6f0fa;border-color:var(--accent)}
.attcard{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.attcard .thumb{width:130px;height:150px;flex:none;border:1px solid var(--line);border-radius:6px;background:#fafaf8;display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
.attcard .thumb img,.attcard .thumb canvas{max-width:100%;max-height:100%;object-fit:contain}
.pdfic{font-weight:700;color:#b4441f;font-size:20px;border:2px solid #b4441f;border-radius:6px;padding:8px 10px}
.abody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.arow{display:flex;gap:10px;align-items:end}.arow .f{flex:1}
.ano{font-weight:700;color:var(--accent);white-space:nowrap;padding-bottom:6px}
.ainfo{font-family:var(--mono);font-size:12px;color:var(--sub);word-break:break-all}
.aacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.aview{max-height:75vh;overflow:auto;background:#eef0ec;padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.aview img,.aview canvas{max-width:100%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#tabs .st.cnt{background:#dfe4ea;color:#39424b}
.trow.sub2{font-weight:400;font-size:clamp(13px,1.6vw,16px);margin:8px 0 8px 2.2em;color:#39424b}
.trow .td{flex:1;border-bottom:2px dotted #b8c0c7;transform:translateY(-5px)}
.trow .tp{font-family:var(--mono);min-width:2.5em;text-align:right}
.tocbar{max-width:820px;margin:0 auto 12px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.slab{border:1px solid #d7dee6;background:#f6f9fc;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.slab.on{border-color:#9cc0e4}
.slabres{display:flex;flex-direction:column;justify-content:center;font-family:var(--mono);font-size:12.5px;color:#1f4e79;background:#fff;border:1px dashed #9cc0e4;border-radius:6px;padding:4px 8px}
tr.gen td{background:#f3f7fb}tr.gen input,tr.gen select{color:#5d6670;background:#f3f7fb}
.gtag{font-size:10.5px;color:#1f4e79;background:#dbe8f5;border-radius:8px;padding:1px 6px;white-space:nowrap}
#unitBar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 20px;background:#f8f9f7;border-bottom:1px solid var(--line);font-size:13px}
#unitBar .ub-t{color:var(--accent);white-space:nowrap}
#unitSel{display:flex;gap:6px 14px;flex-wrap:wrap}
#unitBar .ub-f{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12.5px;white-space:nowrap}
#unitBar .ub-f select{width:auto;padding:3px 6px}
#unitPre{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
#unitPre button{padding:3px 9px;font-size:12px}
#unitBar .ub-i{cursor:help;color:var(--sub)}
#unitBar .ub-sep{width:1px;align-self:stretch;background:var(--line)}
#unitBar .ub-g{font-weight:600;color:var(--sub);font-size:12.5px}
#codeSel{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
#codeSel select{max-width:330px}
.seg.sm button{padding:3px 12px;font-size:12.5px}
table.combo input{width:52px;padding:4px 4px}
table.combo td.lbl{font-family:var(--mono);font-size:11.5px;color:var(--sub);white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1 data-i="title"></h1>
  <span class="tag" data-i="tag"></span>
  <div class="right">
    <span id="docName"></span>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    <select id="lang" title="Language"></select>
    <button id="printBtn" class="pri" data-i="printBtn"></button>
    <div class="fwrap"><button id="fileBtn"><span data-i="file"></span> ▾</button><div id="fileMenu"></div></div>
  </div>
</header>
<nav id="tabs"></nav>
<div id="unitBar"><b class="ub-t">⚙ <span data-i="globalSet"></span></b><div id="codeSel"></div><span class="ub-sep"></span><span class="ub-g" data-i="units"></span><div id="unitSel"></div><div id="unitPre"></div><span class="ub-i" id="unitInfo">ⓘ</span></div>
<div id="tabNote"></div>
<div id="colWrap" style="display:none"><iframe id="colFrame" title="steel column" style="width:100%;border:0;display:block;background:var(--bg)"></iframe></div>
<div id="pageWrap" style="display:none;padding:16px"></div>
<main>
  <section class="inputs">
    <div class="panel">
      <h2><span class="num">1</span><span data-i="p1"></span><span class="sp"></span><button id="addSpan" data-i="addSpan"></button></h2>
      <div id="spans"></div>
      <button id="copyProps" style="width:100%" data-i="copyProps"></button>
    </div>
    <div class="panel">
      <h2><span class="num">2</span><span data-i="p2"></span></h2>
      <table class="rows" id="sups"></table>
      <div class="note" style="margin-top:6px" data-i="settleNote"></div>
    </div>
    <div class="panel">
      <h2><span class="num">3</span><span data-i="p3"></span><span class="sp"></span><button data-add="points" data-i="add"></button></h2>
      <table class="rows" id="points"></table>
    </div>
    <div class="panel">
      <h2><span class="num">4</span><span data-i="p4"></span><span class="sp"></span><button data-add="dists" data-i="add"></button></h2>
      <div id="slabBox"></div>
      <table class="rows" id="dists"></table>
      <div class="note" style="margin-top:6px" data-i="distNote"></div>
    </div>
    <div class="panel">
      <h2><span class="num">5</span><span data-i="p5"></span><span class="sp"></span><button data-add="moments" data-i="add"></button></h2>
      <table class="rows" id="moments"></table>
    </div>
    <div class="panel">
      <h2><span class="num">6</span><span data-i="p6"></span></h2>
      <div class="note" id="methodName" style="margin:0 0 8px"></div>
      <label class="chk"><input type="checkbox" id="bothWE"> <span data-i="bothWE"></span></label>
      <div class="tblwrap mt"><table class="rows combo" id="combos"></table></div>
      <div style="display:flex;gap:8px;margin-top:6px"><button id="addCombo" data-i="addCombo"></button><button id="resetCombo" data-i="resetCombo"></button></div>
      <div class="note mt" data-i="comboNote"></div>
      <div class="g g2 mt">
        <label class="f"><span><span data-i="deflLim"></span> – <span data-i="deflL"></span></span><input type="number" id="dlL" min="1"></label>
        <label class="f"><span data-i="deflT"></span><input type="number" id="dlT" min="1"></label>
        <label class="f"><span data-i="dlMode"></span><select id="dlMode"><option value="ratio"></option><option value="abs"></option><option value="both"></option></select></label>
        <label class="f"><span id="dlAbsLab"></span><input type="number" id="dlAbs" min="0" step="any"></label>
      </div>
      <div class="note" data-i="deflNote"></div>
    </div>
    <div class="panel note">
      <details class="help"><summary data-i="help"></summary>
        <p data-ih="help1"></p><p data-ih="help2"></p><p data-ih="help3"></p><p data-ih="help4"></p><p data-ih="codes"></p>
      </details>
    </div>
  </section>

  <section>
    <div class="err" id="err"></div>
    <div class="cards" id="cards"></div>
    <div class="viewbar"><b data-i="view"></b><select id="view"></select><span class="note" id="viewNote"></span></div>
    <div class="readout" id="readout"></div>
    <div class="chart"><div class="hd"><b data-i="model"></b><span id="modelInfo"></span></div><svg id="cModel" viewBox="0 0 1000 210"></svg></div>

<script>// ===== 連續梁直接勁度法求解器（多載重類別） =====

  const hex16 = s => { let h = 'FEFF'; for (const ch of s) { const cp = ch.codePointAt(0); if (cp > 0xffff) { const v = cp - 0x10000; h += (0xd800 + (v >> 10)).toString(16).padStart(4, '0') + (0xdc00 + (v & 0x3ff)).toString(16).padStart(4, '0'); } else h += cp.toString(16).padStart(4, '0'); } return '<' + h.toUpperCase() + '>'; };
  const obj = (id, body) => { offs[id] = len; push(`${id} 0 obj\n`); body(); push('\nendobj\n'); };
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  // 1 catalog, 2 pages, 3 info, then per page: page, content, image
  const kids = canvases.map((_, i) => `${4 + i * 3} 0 R`).join(' ');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  const d = new Date(), pad = v => String(v).padStart(2, '0');
  obj(3, () => push(`<< /Title ${hex16(title)} /Producer (Continuous Beam App) /CreationDate (D:${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}) >>`));
  for (let i = 0; i < n; i++) {
    const c = canvases[i], id = 4 + i * 3;
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
    const jpg = new Uint8Array(await blob.arrayBuffer());
    const cs = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(id, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${id + 2} 0 R >> >> /Contents ${id + 1} 0 R >>`));
    obj(id + 1, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(id + 2, () => { push(`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push('\nendstream'); });
  }

  let x = `xref\n0 ${total}\n0000000000 65535 f \n`; for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';

}

; // N/mm³\n\n/* ============ Data ============ */\nconst GRADES=[['SS400',245],['SN400B',235],['SN490B',325],['SM490A',325],['ASTM A36',250],['ASTM A572 Gr.50',345],['ASTM A992',345],['ASTM A500 Gr.C',345],['ASTM A53 Gr.B',240],['STK400 (JIS G3444)',235],['STK500 (JIS G3444)',355]];\n// [designation, d, bf, tw, tf] mm (JIS / CNS rolled H)\nconst HT=[\n['H100×100×6×8',100,100,6,8],['H125×125×6.5×9',125,125,6.5,9],['H150×150×7×10',150,150,7,10],\n['H175×175×7.5×11',175,175,7.5,11],['H200×200×8×12',200,200,8,12],['H250×250×9×14',250,250,9,14],\n['H300×300×10×15',300,300,10,15],['H350×350×12×19',350,350,12,19],['H400×400×13×21',400,400,13,21],\n['H414×405×18×28',414,405,18,28],['H428×407×20×35',428,407,20,35],['H458×417×30×50',458,417,30,50],\n['H148×100×6×9',148,100,6,9],['H194×150×6×9',194,150,6,9],['H244×175×7×11',244,175,7,11],\n['H294×200×8×12',294,200,8,12],['H340×250×9×14',340,250,9,14],['H390×300×10×16',390,300,10,16],\n['H440×300×11×18',440,300,11,18],['H488×300×11×18',488,300,11,18],['H588×300×12×20',588,300,12,20],\n['H200×100×5.5×8',200,100,5.5,8],['H250×125×6×9',250,125,6,9],['H300×150×6.5×9',300,150,6.5,9],\n['H350×175×7×11',350,175,7,11],['H400×200×8×13',400,200,8,13],['H450×200×9×14',450,200,9,14],\n['H500×200×10×16',500,200,10,16],['H600×200×11×17',600,200,11,17]];\n// K: [theoretical, recommended] (AISC Commentary Table C-A-7.1)\nconst BCK={a:[0.5,0.65],b:[0.7,0.8],c:[1.0,1.2],d:[1.0,1.0],e:[2.0,2.1],f:[2.0,2.0]};\n\n/* ============ Section properties ============ */\nfunction props(s){\n  let A,Ix,Iy,el=[];\n  if(s.type==='H'){\n    const {d,bf,tw,tf}=s,h=d-2*tf;\n    A=2*bf*tf+h*tw;\n    Ix=(bf*d**3-(bf-tw)*h**3)/12;\n    Iy=(2*tf*bf**3+h*tw**3)/12;\n    let kc=4/Math.sqrt(h/tw);kc=Math.min(0.76,Math.max(0.35,kc));\n    el.push({key:'flange',kind:s.built?'unstiffB':'unstiff',b:bf/2,t:tf,n:4,kc});\n    el.push({key:'web',kind:'stiff',b:h,t:tw,n:1});\n  }else if(s.type==='box'){\n    const {B,H,t}=s;\n    A=B*H-(B-2*t)*(H-2*t);\n    Ix=(B*H**3-(B-2*t)*(H-2*t)**3)/12;\n    Iy=(H*B**3-(H-2*t)*(B-2*t)**3)/12;\n    el.push({key:'wallB',kind:'hss',b:Math.max(B-3*t,0),t,n:2});\n    el.push({key:'wallH',kind:'hss',b:Math.max(H-3*t,0),t,n:2});\n  }else if(s.type==='pipe'){\n    const {D,t}=s,di=D-2*t;\n    A=Math.PI/4*(D*D-di*di);Ix=Iy=Math.PI/64*(D**4-di**4);\n    el.push({key:'wallR',kind:'round',b:D,t,n:1});\n  }else{A=s.A;Ix=s.Ix;Iy=s.Iy;}\n  return {A,Ix,Iy,rx:Math.sqrt(Ix/A),ry:Math.sqrt(Iy/A),el};\n}\nfunction localCheck(P,Fy,E){\n  const sE=Math.sqrt(E/Fy);\n  return P.el.map(e=>{\n    const lam=e.b/e.t;let lr;\n    if(e.kind==='unstiff')lr=0.56*sE;\n    else if(e.kind==='unstiffB')lr=0.64*Math.sqrt(e.kc*E/Fy);\n    else if(e.kind==='stiff')lr=1.49*sE;\n    else if(e.kind==='hss')lr=1.40*sE;\n    else lr=0.11*E/Fy;\n    return Object.assign({},e,{lam,lr,slender:lam>lr});\n  });\n}\n\n/* ============ Strength ============ */\nfunction strength(P,loc,lam,Fy,E,code,method){\n  const R={};\n  if(code==='AISC'){\n    const Fe=lam>0?Math.PI**2*E/lam**2:Infinity;\n    const inel=Fy/Fe<=2.25;\n    const Fcr=inel?Math.pow(0.658,Fy/Fe)*Fy:0.877*Fe;\n    let Ae=P.A,red=[],roundW=false;\n    for(const e of loc){\n      if(e.kind==='round'){\n        if(e.lam>e.lr){Ae=Math.min(Ae,(0.038*E/(Fy*e.lam)+2/3)*P.A);red.push({key:e.key,be:null});if(e.lam>0.45*E/Fy)roundW=true;}\n      }else if(e.lam>e.lr*Math.sqrt(Fy/Fcr)){\n        const c=e.kind==='stiff'?[0.18,1.31]:e.kind==='hss'?[0.20,1.38]:[0.22,1.49];\n        const Fel=(c[1]*e.lr/e.lam)**2*Fy,s=Math.sqrt(Fel/Fcr);\n        const be=Math.min(e.b,e.b*(1-c[0]*s)*s);\n        Ae-=e.n*(e.b-be)*e.t;red.push({key:e.key,be,b:e.b});\n      }\n    }\n    const Pn=Fcr*Ae;\n    Object.assign(R,{Fe,inel,Fcr,Ae,red,roundW,Pn,\n      phi:0.9,omega:1.67,avail:method==='LRFD'?0.9*Pn:Pn/1.67});\n  }else{\n    // Taiwan code (Q-factor method)\n    let Qs=1,Qa=1,Aeff=P.A,roundW=false;const f=Fy,sE=Math.sqrt(E/Fy);\n    for(const e of loc){\n      if(!e.slender)continue;\n      if(e.kind==='unstiff'){\n        const q=e.lam<=1.03*sE?1.415-0.74*e.lam*Math.sqrt(Fy/E):0.69*E/(Fy*e.lam**2);Qs=Math.min(Qs,q);\n      }else if(e.kind==='unstiffB'){\n        const k=e.kc,q=e.lam<=1.17*Math.sqrt(E*k/Fy)?1.415-0.65*e.lam*Math.sqrt(Fy/(k*E)):0.90*E*k/(Fy*e.lam**2);Qs=Math.min(Qs,q);\n      }else if(e.kind==='stiff'||e.kind==='hss'){\n        const cf=e.kind==='stiff'?0.34:0.38;\n        const be=Math.min(e.b,1.92*e.t*Math.sqrt(E/f)*(1-cf/e.lam*Math.sqrt(E/f)));\n        Aeff-=e.n*(e.b-be)*e.t;\n      }else if(e.kind==='round'){\n        Qa=Math.min(Qa,0.038*E/(Fy*e.lam)+2/3);if(e.lam>0.45*E/Fy)roundW=true;\n      }\n    }\n    Qa=Math.min(Qa,Aeff/P.A);const Q=Qs*Qa;\n    if(method==='LRFD'){\n      const lc=lam/Math.PI*Math.sqrt(Fy/E);const inel=lc*Math.sqrt(Q)<=1.5;\n      const Fcr=inel?Q*Math.pow(0.658,Q*lc*lc)*Fy:0.877/(lc*lc)*Fy;\n      const Pn=Fcr*P.A;\n      Object.assign(R,{Qs,Qa,Q,lc,inel,Fcr,Pn,phi:0.85,avail:0.85*Pn,roundW});\n    }else{\n      const Cc=Math.sqrt(2*Math.PI**2*E/(Q*Fy));const inel=lam<=Cc;let FS,Fa;\n      if(inel){FS=5/3+3*lam/(8*Cc)-lam**3/(8*Cc**3);Fa=Q*(1-lam*lam/(2*Cc*Cc))*Fy/FS;}\n      else{FS=23/12;Fa=12*Math.PI**2*E/(23*lam*lam);}\n      Object.assign(R,{Qs,Qa,Q,Cc,inel,FS,Fa,avail:Fa*P.A,roundW});\n    }\n  }\n  return R;\n}\nfunction analyze(I){\n  const P=props(I.sec);\n  const lx=I.Kx*I.L/P.rx,ly=I.Ky*I.Ly/P.ry,lam=Math.max(lx,ly);\n  const loc=localCheck(P,I.Fy,I.E);\n  const S=strength(P,loc,lam,I.Fy,I.E,I.code,I.method);\n  const Pw=I.selfwt?P.A*I.L*GAMMA:0,D=I.PD+Pw;\n  let Pr,combo;\n  if(I.method==='LRFD'){const c1=1.4*D,c2=1.2*D+1.6*I.PL;Pr=Math.max(c1,c2);combo={c1,c2};}\n  else{Pr=D+I.PL;combo={};}\n  const Pcrx=Math.PI**2*I.E*P.Ix/(I.Kx*I.L)**2,Pcry=Math.PI**2*I.E*P.Iy/(I.Ky*I.Ly)**2,Pcr=Math.min(Pcrx,Pcry);\n  const cr={Pcrx,Pcry,Pcr,sig:Pcr/P.A,Py:I.Fy*P.A};\n  return {P,lx,ly,lam,gov:lx>=ly?'x':'y',loc,S,Pw,D,Pr,combo,cr,ratio:Pr/S.avail,lamOK:lam<=200};\n}\n\n/* ============ Input handling ============ */\nfunction num(id){return parseFloat($(id).value);}\nfunction readSI(){\n  const dF=factor('dim'),lF=factor('len'),fF=factor('force'),sF=factor('stress');\n  const type=$('secType').value;let sec,name='';\n  if(type==='rolled'){const r=HT[+$('shape').value];sec={type:'H',d:r[1],bf:r[2],tw:r[3],tf:r[4],built:false};name=r[0];}\n  else if(type==='built')sec={type:'H',d:num('hd')*dF,bf:num('hbf')*dF,tw:num('htw')*dF,tf:num('htf')*dF,built:true};\n  else if(type==='box')sec={type:'box',H:num('bH')*dF,B:num('bB')*dF,t:num('bt')*dF};\n  else if(type==='pipe')sec={type:'pipe',D:num('pD')*dF,t:num('pt')*dF};\n  else sec={type:'custom',A:num('cA')*dF*dF,Ix:num('cIx')*dF**4,Iy:num('cIy')*dF**4};\n  const L=num('L')*lF;const Lyv=$('Ly').value.trim();\n  return {code:$('code').value,method:$('method').value,Fy:num('Fy')*sF,E:num('E')*sF,sec,name,stype:type,\n    L,Ly:Lyv===''?L:parseFloat(Lyv)*lF,Kx:num('Kx'),Ky:num('Ky'),PD:(num('PD')||0)*fF,PL:(num('PL')||0)*fF,selfwt:$('selfwt').checked};\n}\nfunction valid(I){\n  const s=I.sec,pos=v=>isFinite(v)&&v>0;\n  if(![I.Fy,I.E,I.L,I.Ly,I.Kx,I.Ky].every(pos))return false;\n  if(s.type==='H')return [s.d,s.bf,s.tw,s.tf].every(pos)&&2*s.tf<s.d&&s.tw<s.bf;\n  if(s.type==='box')return [s.B,s.H,s.t].every(pos)&&2*s.t<Math.min(s.B,s.H);\n  if(s.type==='pipe')return [s.D,s.t].every(pos)&&2*s.t<s.D;\n  return [s.A,s.Ix,s.Iy].every(pos);\n}\n\n/* ============ Formatting ============ */\nfunction fmt(v,dg){\n  if(v===null||v===undefined||!isFinite(v))return '—';\n  const a=Math.abs(v);let d=dg!==undefined?dg:(a>=1e5?0:a>=1000?1:a>=100?2:a>=1?3:4);\n  if(a>=1e7&&dg===undefined)return v.toExponential(4);\n  return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});\n}\nconst sF_=v=>fmt(v/factor('force'))+' '+unit('force');\nconst sS_=v=>fmt(v/factor('stress'))+' '+unit('stress');\nconst sL_=v=>fmt(v/factor('len'))+' '+unit('len');\nconst sD_=v=>fmt(v/factor('dim'))+' '+unit('dim');\nconst sA_=v=>fmt(v/factor('area'))+' '+unit('area');\nconst sI_=v=>fmt(v/factor('inertia'))+' '+unit('inertia');\nconst sW_=v=>fmt(v*factor('len')/factor('force'))+' '+unit('force')+'/'+unit('len');\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\n/* ============ Boundary-condition figure ============ */\nconst SHAPE={a:s=>(1-Math.cos(2*Math.PI*s))/2,b:s=>6.75*s*s*(1-s),c:s=>(1-Math.cos(Math.PI*s))/2,\n  d:s=>Math.sin(Math.PI*s),e:s=>1-Math.cos(Math.PI*s/2),f:s=>Math.sin(Math.PI*s/2),g:s=>Math.sin(Math.PI*s)};\nconst ENDS={a:['fix','fix'],b:['fix','pin'],c:['fix','guide'],d:['pin','pin'],e:['fix','free'],f:['pin','guide'],g:['pin','pin']};\nfunction bcSVG(bc,K){\n  const W=110,Hh=200,x0=45,yb=168,yt=38,amp=26,f=SHAPE[bc];\n  let pts=[];for(let i=0;i<=40;i++){const s=i/40;pts.push((x0+amp*f(s)).toFixed(1)+','+(yb-(yb-yt)*s).toFixed(1));}\n  const xt=x0+amp*f(1),[bot,top]=ENDS[bc];\n  const hatch=(x,y,up)=>{let g=`<line x1=\"${x-16}\" y1=\"${y}\" x2=\"${x+16}\" y2=\"${y}\" stroke=\"#1d2329\" stroke-width=\"2\"/>`;\n    for(let i=-16;i<16;i+=5)g+=`<line x1=\"${x+i}\" y1=\"${y}\" x2=\"${x+i+5}\" y2=\"${y+(up?-6:6)}\" stroke=\"#1d2329\" stroke-width=\"1\"/>`;return g;};\n  const tri=(x,y,up)=>`<path d=\"M${x} ${y} L${x-8} ${y+(up?-12:12)} L${x+8} ${y+(up?-12:12)} Z\" fill=\"#fff\" stroke=\"#1d2329\" stroke-width=\"1.5\"/>`;\n  let g='';\n  g+=bot==='fix'?hatch(x0,yb,false):tri(x0,yb,false)+hatch(x0,yb+12,false);\n  if(top==='fix')g+=hatch(xt,yt,true);\n  else if(top==='pin')g+=tri(xt,yt,true)+``;\n  else if(top==='guide')g+=`<rect x=\"${xt-12}\" y=\"${yt-6}\" width=\"24\" height=\"6\" fill=\"#dbe8f5\" stroke=\"#1d2329\"/><line x1=\"${xt-22}\" y1=\"${yt-9}\" x2=\"${xt+22}\" y2=\"${yt-9}\" stroke=\"#1d2329\" stroke-width=\"1\"/>`;\n  const ay=top==='free'?yt:yt-(top==='pin'?18:10);\n  return `<svg viewBox=\"0 0 ${W} ${Hh}\" width=\"${W}\" height=\"${Hh}\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"${x0}\" y1=\"${yb}\" x2=\"${x0}\" y2=\"${yt}\" stroke=\"#9aa3ab\" stroke-dasharray=\"4 3\"/>\n  <polyline points=\"${pts.join(' ')}\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"3\"/>\n  ${g}\n  <line x1=\"${xt}\" y1=\"${ay-24}\" x2=\"${xt}\" y2=\"${ay-4}\" stroke=\"#b4441f\" stroke-width=\"2\"/>\n  <path d=\"M${xt} ${ay-1} l-5 -8 h10 z\" fill=\"#b4441f\"/>\n  <text x=\"${xt+7}\" y=\"${ay-16}\" font-size=\"12\" fill=\"#b4441f\">P<\/text>\n  <text x=\"${W-2}\" y=\"${(yb+yt)/2}\" font-size=\"12\" text-anchor=\"end\" fill=\"#1d2329\">${K!=null?'K='+fmt(K,2):''}<\/text>\n  <\/svg>`;\n}\n\n/* ============ Strength curve ============ */\nfunction curveSVG(I,R){\n  const W=640,H=270,ml=62,mr=16,mt=16,mb=40,pw=W-ml-mr,ph=H-mt-mb,xmax=250;\n  const P=R.P,loc=R.loc;const ff=factor('force');\n  let pts=[],ymax=0;\n  for(let l=1;l<=xmax;l+=1){const s=strength(P,loc,l,I.Fy,I.E,I.code,I.method);pts.push([l,s.avail]);ymax=Math.max(ymax,s.avail);}\n  ymax=Math.max(ymax,R.Pr)*1.08;\n  const X=l=>ml+l/xmax*pw,Y=v=>mt+ph-v/ymax*ph;\n  const step=niceStep(ymax/ff/5);let gy='';\n  for(let v=0;v<=ymax/ff+1e-9;v+=step){const y=Y(v*ff);gy+=`<line x1=\"${ml}\" x2=\"${ml+pw}\" y1=\"${y}\" y2=\"${y}\" stroke=\"#eceee9\"/><text x=\"${ml-6}\" y=\"${y+4}\" font-size=\"11\" text-anchor=\"end\" fill=\"#5d6670\">${fmt(v,step<1?2:0)}<\/text>`;}\n  let gx='';for(let l=0;l<=xmax;l+=50){gx+=`<text x=\"${X(l)}\" y=\"${mt+ph+16}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5d6670\">${l}<\/text>`;}\n  let ep=[];for(let l=1;l<=xmax;l+=1){const v=Math.PI**2*I.E*P.A/(l*l);if(v<=ymax)ep.push(X(l).toFixed(1)+' '+Y(v).toFixed(1));}\n  const epath=ep.length?'M'+ep.join(' L'):'';\n  const ecy=Y(Math.min(R.cr.Pcr,ymax));\n  const path='M'+pts.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' L');\n  const cx=X(Math.min(R.lam,xmax)),cy=Y(R.S.avail),ok=R.ratio<=1&&R.lamOK;\n  const capL=I.method==='LRFD'?(I.code==='AISC'?'φcPn':'φcPn'):(I.code==='AISC'?'Pn/Ωc':'Pa = Fa·A');\n  return `<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:${W}px\">\n  ${gy}${gx}\n  <rect x=\"${X(200)}\" y=\"${mt}\" width=\"${X(250)-X(200)}\" height=\"${ph}\" fill=\"#fbe5dd\"/>\n  <text x=\"${X(225)}\" y=\"${mt+14}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#b4441f\">KL/r &gt; 200<\/text>\n  <line x1=\"${ml}\" x2=\"${ml+pw}\" y1=\"${mt+ph}\" y2=\"${mt+ph}\" stroke=\"#1d2329\"/>\n  <line x1=\"${ml}\" x2=\"${ml}\" y1=\"${mt}\" y2=\"${mt+ph}\" stroke=\"#1d2329\"/>\n  <path d=\"${epath}\" fill=\"none\" stroke=\"#6b3fa0\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/>\n  ${R.cr.Pcr<=ymax?`<circle cx=\"${cx}\" cy=\"${ecy}\" r=\"4\" fill=\"#6b3fa0\"/>`:''}\n  <path d=\"${path}\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"2.5\"/>\n  <line x1=\"${ml+pw-150}\" x2=\"${ml+pw-128}\" y1=\"${mt+34}\" y2=\"${mt+34}\" stroke=\"#6b3fa0\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/>\n  <text x=\"${ml+pw-124}\" y=\"${mt+38}\" font-size=\"11\" fill=\"#6b3fa0\">${esc(t('euler'))}<\/text>\n  <line x1=\"${ml+pw-150}\" x2=\"${ml+pw-128}\" y1=\"${mt+52}\" y2=\"${mt+52}\" stroke=\"#1f4e79\" stroke-width=\"2.5\"/>\n  <text x=\"${ml+pw-124}\" y=\"${mt+56}\" font-size=\"11\" fill=\"#1f4e79\">${capL}<\/text>\n  <line x1=\"${ml}\" x2=\"${ml+pw}\" y1=\"${Y(R.Pr)}\" y2=\"${Y(R.Pr)}\" stroke=\"#9b3415\" stroke-dasharray=\"6 4\" stroke-width=\"1.5\"/>\n  <text x=\"${ml+pw-4}\" y=\"${Y(R.Pr)-5}\" font-size=\"11\" text-anchor=\"end\" fill=\"#9b3415\">${esc(t('demand'))} = ${esc(sF_(R.Pr))}<\/text>\n  <circle cx=\"${cx}\" cy=\"${cy}\" r=\"5.5\" fill=\"${ok?'#2f7d4f':'#b4441f'}\" stroke=\"#fff\" stroke-width=\"1.5\"/>\n  <text x=\"${cx+9}\" y=\"${cy-8}\" font-size=\"11.5\" fill=\"#1d2329\">${esc(t('current'))} (${fmt(R.lam,1)}, ${esc(sF_(R.S.avail))})<\/text>\n  <text x=\"${ml+pw/2}\" y=\"${H-6}\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d2329\">${esc(t('curveX'))}<\/text>\n  <text x=\"14\" y=\"${mt+ph/2}\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1d2329\" transform=\"rotate(-90 14 ${mt+ph/2})\">${capL} (${unit('force')})<\/text>\n  <\/svg>`;\n}\nfunction niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const m=x/p;return (m<1.5?1:m<3?2:m<7?5:10)*p;}\n\n/* ============ Report ============ */\nfunction render(){\n  const I=readSI();const rep=$('report');\n  updateBCfig();\n  if(!valid(I)){rep.innerHTML=`<div class=\"blk\"><p class=\"ngc\">${esc(t('invalid'))}<\/p><\/div>`;return;}\n  const R=analyze(I);const S=R.S,P=R.P;\n  const ok=R.ratio<=1&&R.lamOK;\n  const methodTxt=t(I.method==='ASD'?'asd':'lrfd'),codeTxt=t(I.code==='TW'?'codeTW':'codeAISC');\n  const gradeTxt=$('grade').value==='custom'?t('custom'):GRADES[+$('grade').value][0];\n  const stype=$('secType').selectedOptions[0].textContent;\n  let dimsTxt='';const s=I.sec,dd=v=>fmt(v/factor('dim'),2).replace(/\\.?0+$/,'');\n  if(I.stype==='rolled')dimsTxt=I.name+' (mm)';\n  else if(s.type==='H')dimsTxt=`H ${dd(s.d)}×${dd(s.bf)}×${dd(s.tw)}×${dd(s.tf)} ${unit('dim')}`;\n  else if(s.type==='box')dimsTxt=`□ ${dd(s.H)}×${dd(s.B)}×${dd(s.t)} ${unit('dim')}`;\n  else if(s.type==='pipe')dimsTxt=`○ ${dd(s.D)}×${dd(s.t)} ${unit('dim')}`;\n  else dimsTxt='—';\n  const bc=$('bc').value;\n  const row=(k,v)=>`<tr><td>${esc(k)}<\/td><td class=\"num\">${v}<\/td><\/tr>`;\n  const dt=$('dt').value;\n\n  let h='';\n  // Header\n  h+=`<div class=\"blk\"><div class=\"rh\"><div><h1>${esc(t('report'))}<\/h1><div class=\"code\">${esc(codeTxt)} ／ ${esc(methodTxt)}<\/div><\/div>\n  <div style=\"text-align:right;font-size:12px;color:#5d6670\">${esc(t('member'))}<div style=\"font-size:20px;font-weight:700;color:#1d2329\">${esc($('mb').value||'—')}<\/div><\/div><\/div>\n  <div class=\"meta\"><div><b>${esc(t('project'))}<\/b>${esc($('pj').value||'—')}<\/div><div><b>${esc(t('designer'))}<\/b>${esc($('dz').value||'—')}<\/div>\n  <div><b>${esc(t('date'))}<\/b>${esc(dt||'—')}<\/div><div><b>${esc(t('shape'))}<\/b>${esc(dimsTxt)}<\/div><\/div><\/div>`;\n\n  // Summary\n  const rc=ok?'#2f7d4f':'#b4441f';\n  h+=`<div class=\"blk\"><h3>${esc(t('summary'))}<\/h3><div class=\"verdict\">\n   <div><small>${esc(t('demand'))} ${I.method==='LRFD'?'Pu':'P'}<\/small><div class=\"v\">${esc(sF_(R.Pr))}<\/div><\/div>\n   <div><small>${esc(t('capacity'))} ${I.method==='LRFD'?'φcPn':(I.code==='AISC'?'Pn/Ωc':'Fa·A')}<\/small><div class=\"v\">${esc(sF_(S.avail))}<\/div><\/div>\n   <div><small>${esc(t('ratio'))}<\/small><div class=\"v\" style=\"color:${rc}\">${fmt(R.ratio,3)}<\/div><div class=\"bar\"><i style=\"width:${Math.min(100,R.ratio*100)}%;background:${rc}\"><\/i><\/div><\/div>\n   <div><small>${esc(t('result'))}<\/small><div class=\"big\" style=\"color:${rc}\">${esc(t(ok?'ok':'ng'))}<\/div>\n   <div style=\"font-size:11px;color:${R.lamOK?'#5d6670':'#b4441f'}\">KL/r = ${fmt(R.lam,1)} ${R.lamOK?'≤':'>'} 200<\/div><\/div><\/div>\n   <div style=\"display:flex;gap:28px;flex-wrap:wrap;border:1px solid #dde1dc;border-top:0;border-radius:0 0 8px 8px;padding:8px 12px;font-size:12.5px\">\n   <div><span style=\"color:#5d6670\">${esc(t('Pcr'))}<\/span> <b class=\"num\">${esc(sF_(R.cr.Pcr))}<\/b> <span style=\"color:#5d6670\">(${esc(t(R.gov==='x'?'axisX':'axisY'))})<\/span><\/div>\n   <div><span style=\"color:#5d6670\">${esc(t('crMargin'))}<\/span> <b class=\"num\">${fmt(R.cr.Pcr/R.Pr,2)}<\/b><\/div><\/div><\/div>`;\n\n  // 1 Inputs\n  h+=`<div class=\"blk\"><h3>1. ${esc(t('r1'))}<\/h3><div class=\"kv2\"><table class=\"kv\">\n   ${row(t('grade'),esc(gradeTxt))}${row(t('Fy'),esc(sS_(I.Fy)))}${row(t('E'),esc(sS_(I.E)))}\n   ${row(t('secType'),esc(stype))}${row(t('dims'),esc(dimsTxt))}\n   ${row(t('A'),esc(sA_(P.A)))}${row(t('Ix'),esc(sI_(P.Ix)))}${row(t('Iy'),esc(sI_(P.Iy)))}\n   ${row(t('rx'),esc(sD_(P.rx)))}${row(t('ry'),esc(sD_(P.ry)))}\n   <\/table><table class=\"kv\">\n   ${row(t('wt'),esc(sW_(P.A*GAMMA)))}\n   ${row(t('L'),esc(sL_(I.L)))}${row(t('Ly'),esc(sL_(I.Ly)))}\n   ${row(t('bc'),esc($('bc').selectedOptions[0].textContent))}\n   ${row(t('Kx'),fmt(I.Kx,2))}${row(t('Ky'),fmt(I.Ky,2))}\n   ${row(t('PD'),esc(sF_(I.PD)))}${row(t('PL'),esc(sF_(I.PL)))}\n   ${row(t('selfw'),esc(I.selfwt?sF_(R.Pw):t('excluded')))}\n   <\/table><\/div><\/div>`;\n\n  // 2 Load combination\n  h+=`<div class=\"blk\"><h3>2. ${esc(t('r2'))}<\/h3>`;\n  h+=`<div class=\"eq\">D = PD${I.selfwt?' + '+esc(t('selfw')):''} = ${esc(sF_(I.PD))}${I.selfwt?' + '+esc(sF_(R.Pw)):''} = ${esc(sF_(R.D))}<\/div>`;\n  if(I.method==='LRFD'){\n    h+=`<div class=\"eq\">1.4D = ${esc(sF_(R.combo.c1))}<\/div><div class=\"eq\">1.2D + 1.6L = ${esc(sF_(R.combo.c2))}<\/div>\n    <div class=\"eq\"><b>Pu = max(…) = ${esc(sF_(R.Pr))}<\/b><\/div>`;\n  }else h+=`<div class=\"eq\"><b>P = D + L = ${esc(sF_(R.D))} + ${esc(sF_(I.PL))} = ${esc(sF_(R.Pr))}<\/b><\/div>`;\n  h+=`<\/div>`;\n\n  // 3 Slenderness\n  h+=`<div class=\"blk\"><h3>3. ${esc(t('r3'))}<\/h3>\n  <div class=\"eq\">(KL/r)x = Kx·L / rx = ${fmt(I.Kx,2)} × ${esc(sD_(I.L))} / ${esc(sD_(P.rx))} = <b>${fmt(R.lx,2)}<\/b> ${R.gov==='x'?'<span class=\"c\">← '+esc(t('gov'))+'<\/span>':''}<\/div>\n  <div class=\"eq\">(KL/r)y = Ky·Ly / ry = ${fmt(I.Ky,2)} × ${esc(sD_(I.Ly))} / ${esc(sD_(P.ry))} = <b>${fmt(R.ly,2)}<\/b> ${R.gov==='y'?'<span class=\"c\">← '+esc(t('gov'))+'<\/span>':''}<\/div>\n  <div class=\"eq\">KL/r = ${fmt(R.lam,2)} — ${esc(t(R.gov==='x'?'axisX':'axisY'))} ． <span class=\"${R.lamOK?'okc':'ngc'}\">${esc(t(R.lamOK?'lamOK':'lamNG'))}<\/span><\/div><\/div>`;\n\n  // 4 Euler critical load\n  const C=R.cr;\n  h+=`<div class=\"blk\"><h3>4. ${esc(t('rCr'))}<\/h3>\n  <div class=\"eq\">Pcr,x = π²E·Ix / (Kx·L)² = π² × ${esc(sS_(I.E))} × ${esc(sI_(P.Ix))} / (${fmt(I.Kx,2)} × ${esc(sD_(I.L))})² = <b>${esc(sF_(C.Pcrx))}<\/b> ${R.gov==='x'?'<span class=\"c\">← '+esc(t('gov'))+'<\/span>':''}<\/div>\n  <div class=\"eq\">Pcr,y = π²E·Iy / (Ky·Ly)² = π² × ${esc(sS_(I.E))} × ${esc(sI_(P.Iy))} / (${fmt(I.Ky,2)} × ${esc(sD_(I.Ly))})² = <b>${esc(sF_(C.Pcry))}<\/b> ${R.gov==='y'?'<span class=\"c\">← '+esc(t('gov'))+'<\/span>':''}<\/div>\n  <div class=\"eq\"><b>Pcr = min(Pcr,x , Pcr,y) = ${esc(sF_(C.Pcr))}<\/b><\/div>\n  <div class=\"eq\">σcr = Pcr / A = π²E / (KL/r)² = ${esc(sS_(C.sig))}<\/div>\n  <div class=\"eq\">Py = Fy · A = ${esc(sF_(C.Py))} ． Pcr / Py = ${fmt(C.Pcr/C.Py,3)} <span class=\"c\">${esc(t(C.Pcr>C.Py?'crGtPy':'crLtPy'))}<\/span><\/div>\n  <div class=\"eq\">${esc(t('crMargin'))} = ${esc(sF_(C.Pcr))} / ${esc(sF_(R.Pr))} = <b>${fmt(C.Pcr/R.Pr,2)}<\/b><\/div>\n  <p class=\"note\">${esc(t('crNote'))}<\/p><\/div>`;\n\n  // 5 Local buckling\n  h+=`<div class=\"blk\"><h3>5. ${esc(t('r4'))}<\/h3>`;\n  if(!R.loc.length)h+=`<p class=\"note\">${esc(t('noLocal'))}<\/p>`;\n  else{\n    h+=`<table><tr><th>${esc(t('element'))}<\/th><th class=\"num\">${esc(t('lamCol'))}<\/th><th class=\"num\">${esc(t('lamr'))}<\/th><th>${esc(t('status'))}<\/th><\/tr>`;\n    const lrF={unstiff:'0.56√(E/Fy)',unstiffB:'0.64√(kc·E/Fy)',stiff:'1.49√(E/Fy)',hss:'1.40√(E/Fy)',round:'0.11E/Fy'};\n    for(const e of R.loc)h+=`<tr><td>${esc(t(e.key))}<\/td><td class=\"num\">${fmt(e.lam,2)}<\/td><td class=\"num\">${lrF[e.kind]} = ${fmt(e.lr,2)}<\/td><td class=\"${e.slender?'wc':'okc'}\">${esc(t(e.slender?'slender':'nonslender'))}<\/td><\/tr>`;\n    h+=`<\/table>`;\n    if(R.loc.some(e=>e.slender))h+=`<p class=\"note\">${esc(t(I.code==='TW'?'qNote':'eNote'))}<\/p>`;\n    if(S.roundW)h+=`<p class=\"ngc\" style=\"font-size:12px\">${esc(t('warnRound'))}<\/p>`;\n  }\n  h+=`<\/div>`;\n\n  // 5 Strength\n  h+=`<div class=\"blk\"><h3>6. ${esc(t('r5'))}<\/h3>`;\n  const lam=fmt(R.lam,2);\n  if(I.code==='AISC'){\n    h+=`<div class=\"eq\">Fe = π²E / (KL/r)² = π² × ${esc(sS_(I.E))} / ${lam}² = ${esc(sS_(S.Fe))}<\/div>\n    <div class=\"eq\">Fy / Fe = ${fmt(I.Fy/S.Fe,3)} ${S.inel?'≤':'>'} 2.25 <span class=\"c\">→ ${esc(t(S.inel?'inel':'elas'))}<\/span><\/div>\n    <div class=\"eq\">Fcr = ${S.inel?'0.658^(Fy/Fe) · Fy':'0.877 Fe'} = <b>${esc(sS_(S.Fcr))}<\/b><\/div>\n    <div class=\"eq\">${esc(t('Ae'))} = ${esc(sA_(S.Ae))}${S.Ae<P.A-1e-9?' <span class=\"c\">(Ag = '+esc(sA_(P.A))+')<\/span>':''}<\/div>\n    <div class=\"eq\">Pn = Fcr · Ae = ${esc(sF_(S.Pn))}<\/div>`;\n    h+=I.method==='LRFD'?`<div class=\"eq\"><b>φcPn = 0.90 × ${esc(sF_(S.Pn))} = ${esc(sF_(S.avail))}<\/b><\/div>`\n      :`<div class=\"eq\"><b>Pn / Ωc = ${esc(sF_(S.Pn))} / 1.67 = ${esc(sF_(S.avail))}<\/b><\/div>`;\n  }else{\n    h+=`<div class=\"eq\">${esc(t('Q'))}: Qs = ${fmt(S.Qs,3)}, Qa = ${fmt(S.Qa,3)}, Q = Qs·Qa = <b>${fmt(S.Q,3)}<\/b><\/div>`;\n    if(I.method==='LRFD'){\n      h+=`<div class=\"eq\">λc = (KL/r)/π · √(Fy/E) = ${lam}/π × √(${fmt(I.Fy/I.E,6)}) = ${fmt(S.lc,3)}<\/div>\n      <div class=\"eq\">λc√Q = ${fmt(S.lc*Math.sqrt(S.Q),3)} ${S.inel?'≤':'>'} 1.5 <span class=\"c\">→ ${esc(t(S.inel?'inel':'elas'))}<\/span><\/div>\n      <div class=\"eq\">Fcr = ${S.inel?'Q · 0.658^(Qλc²) · Fy':'(0.877 / λc²) · Fy'} = <b>${esc(sS_(S.Fcr))}<\/b><\/div>\n      <div class=\"eq\">Pn = Fcr · Ag = ${esc(sS_(S.Fcr))} × ${esc(sA_(P.A))} = ${esc(sF_(S.Pn))}<\/div>\n      <div class=\"eq\"><b>φcPn = 0.85 × ${esc(sF_(S.Pn))} = ${esc(sF_(S.avail))}<\/b><\/div>`;\n    }else{\n      h+=`<div class=\"eq\">Cc = √(2π²E / (Q·Fy)) = ${fmt(S.Cc,2)}<\/div>\n      <div class=\"eq\">KL/r = ${lam} ${S.inel?'≤':'>'} Cc <span class=\"c\">→ ${esc(t(S.inel?'inel':'elas'))}<\/span><\/div>`;\n      if(S.inel)h+=`<div class=\"eq\">F.S. = 5/3 + 3(KL/r)/(8Cc) − (KL/r)³/(8Cc³) = ${fmt(S.FS,3)}<\/div>\n        <div class=\"eq\">Fa = Q[1 − (KL/r)²/(2Cc²)]·Fy / F.S. = <b>${esc(sS_(S.Fa))}<\/b><\/div>`;\n      else h+=`<div class=\"eq\">Fa = 12π²E / (23(KL/r)²) = <b>${esc(sS_(S.Fa))}<\/b><\/div>`;\n      const fa=R.Pr/P.A;\n      h+=`<div class=\"eq\">${esc(t('fcheck'))}: fa = P / A = ${esc(sF_(R.Pr))} / ${esc(sA_(P.A))} = ${esc(sS_(fa))} ${fa<=S.Fa?'≤':'>'} Fa<\/div>\n      <div class=\"eq\"><b>Pa = Fa · A = ${esc(sF_(S.avail))}<\/b><\/div>`;\n    }\n  }\n  h+=`<div class=\"eq\"><b>${I.method==='LRFD'?'Pu / φcPn':(I.code==='AISC'?'P / (Pn/Ωc)':'fa / Fa')} = ${fmt(R.ratio,3)} ${R.ratio<=1?'≤':'>'} 1.0 → <span class=\"${R.ratio<=1?'okc':'ngc'}\">${esc(t(R.ratio<=1?'ok':'ng'))}<\/span><\/b><\/div><\/div>`;\n\n  // 6 Curve + BC figure\n  h+=`<div class=\"blk\"><h3>7. ${esc(t('r6'))}<\/h3><div class=\"flex\"><div style=\"flex:1;min-width:0\">${curveSVG(I,R)}<\/div>\n   <div style=\"flex:0 0 110px\">${bcSVG(bc,null)}<div class=\"note\" style=\"text-align:center\">Kx=${fmt(I.Kx,2)} / Ky=${fmt(I.Ky,2)}<\/div><\/div><\/div><\/div>`;\n\n  h+=`<div class=\"blk\"><h3>${esc(t('note'))}<\/h3><p class=\"note\">${esc(t('noteTxt'))}<\/p><\/div>`;\n  rep.innerHTML=h;\n}\n\n/* ============ UI wiring ============ */\nfunction applyLang(){\n  document.documentElement.lang={zh:'zh-Hant',en:'en',th:'th',id:'id'}[lang];\n  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});\n  document.title=t('title');\n  // grade custom label\n  const go=$('grade').querySelector('option[value=custom]');if(go)go.textContent=t('custom');\n  if($('exList'))buildExampleList();if(typeof showName==='function'&&$('fname'))showName();\n  render();\n}\nfunction updateUnitLabels(){document.querySelectorAll('[data-u]').forEach(el=>el.textContent=unit(el.dataset.u));}\nfunction setSI(id,cat,v){$(id).value=Number((v/factor(cat)).toPrecision(6));}\nfunction convertCat(cats,oldF){ // oldF: {cat: factor}\n  document.querySelectorAll('input[data-cat]').forEach(inp=>{\n    const c=inp.dataset.cat;if(!cats.includes(c)||inp.value.trim()==='')return;\n    const v=parseFloat(inp.value);if(!isFinite(v))return;\n    inp.value=Number((v*oldF[c]/factor(c)).toPrecision(6));\n  });\n}\nconst UNIT_SNAPS=[];\nfunction bindUnit(sel,cats){\n  let prev={};const snap=()=>{prev={};cats.forEach(c=>prev[c]=factor(c));};\n  snap();UNIT_SNAPS.push(snap);\n  $(sel).addEventListener('focus',snap);\n  $(sel).addEventListener('change',()=>{convertCat(cats,prev);snap();updateUnitLabels();render();});\n}\nfunction updateSecGroups(){\n  const v=$('secType').value;\n  ['rolled','built','box','pipe','custom'].forEach(k=>$('g_'+k).classList.toggle('hidden',k!==v));\n}\nfunction setKfromBC(){\n  const bc=$('bc').value;if(bc==='g')return;\n  const k=BCK[bc][$('kb').value==='theo'?0:1];$('Kx').value=k;$('Ky').value=k;\n}\nfunction updateBCfig(){$('bcFig').innerHTML=bcSVG($('bc').value,num('Kx'));}\nlet toastT;\nfunction toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}\n\nfunction autoDesign(){\n  $('secType').value='rolled';updateSecGroups();\n  const base=readSI();\n  const order=HT.map((r,i)=>({i,A:props({type:'H',d:r[1],bf:r[2],tw:r[3],tf:r[4]}).A})).sort((a,b)=>a.A-b.A);\n  let found=null;\n  for(const o of order){const r=HT[o.i];\n    const I=Object.assign({},base,{sec:{type:'H',d:r[1],bf:r[2],tw:r[3],tf:r[4],built:false}});\n    const R=analyze(I);if(R.ratio<=1&&R.lamOK){found=o.i;break;}}\n  const m=$('autoMsg');m.classList.remove('hidden');\n  if(found===null){m.textContent=t('autoNone');m.classList.add('bad');}\n  else{$('shape').value=found;m.textContent=t('autoFound')+HT[found][0];m.classList.remove('bad');}\n  render();\n}\n\n/* ============ Print & PDF ============ */\nconst isFramed=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();\nfunction fileBase(){return 'Column_'+(($('mb').value||'C1').replace(/[^\\w\\-]+/g,'_'))+'_'+($('dt').value||'report');}\nasync function getDownloads(){\n  try{if(window.claude&&typeof window.claude.use==='function')return await window.claude.use('downloads');}catch(e){}\n  return null;\n}\nasync function saveFile(name,data,mime){\n  const dl=await getDownloads();\n  if(dl){\n    try{await dl.save({filename:name,data});toast(t('saved'));}\n    catch(e){toast(e&&e.code==='declined'?t('declined'):(t('saveFail')+(e&&e.message||e)));return false;}\n    return true;\n  }\n  const blob=data instanceof Blob?data:new Blob([data],{type:mime});\n  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();\n  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);\n  return true;\n}\nfunction loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src=\"${src}\"]`))return res();\n  const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}\nasync function exportPDF(){\n  toast(t('genPdf'));\n  const rep=$('report');\n  try{\n    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');\n    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');\n    if(document.fonts&&document.fonts.ready)await document.fonts.ready;\n    rep.classList.add('pdfmode');\n    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});\n    const M=12,PW=210-2*M,PH=297-2*M-6;let y=M;\n    for(const blk of rep.querySelectorAll('.blk')){\n      const c=await html2canvas(blk,{scale:2,backgroundColor:'#ffffff',logging:false});\n      let w=PW,h=c.height*PW/c.width;if(h>PH){w=w*PH/h;h=PH;}\n      if(y+h>M+PH&&y>M){pdf.addPage();y=M;}\n      pdf.addImage(c.toDataURL('image/jpeg',0.93),'JPEG',M,y,w,h);y+=h+1.5;\n    }\n    const n=pdf.getNumberOfPages();\n    for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(i+' / '+n,210-M,297-7,{align:'right'});}\n    rep.classList.remove('pdfmode');\n    await saveFile(fileBase()+'.pdf',pdf.output('blob'),'application/pdf');\n  }catch(e){rep.classList.remove('pdfmode');toast(t('pdfFail')+(e.message||e));}\n}\nfunction printableHTML(){\n  const css=$('repcss').textContent;\n  return `<!DOCTYPE html><html lang=\"${document.documentElement.lang}\"><head><meta charset=\"utf-8\"><title>${esc(t('report'))} - ${esc($('mb').value)}<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans:wght@400;500;700&display=swap\">\n<style>${css}<\/style><\/head><body class=\"printdoc\">${$('report').outerHTML}\n<script>window.addEventListener('load',function(){setTimeout(function(){window.print();},500);});<\\/script><\/body><\/html>`;\n}\nfunction doPrint(){\n  if(!isFramed){window.print();return;}\n  $('printModal').classList.remove('hidden');\n}\n\n/* ============ File: new / examples / open / save ============ */\nconst TF=9806.65,KIP=4448.2216,FT=304.8;\nconst BASE={units:{uf:'tf',ul:'m',ud:'mm',us:'kgf/cm²'},code:'TW',method:'ASD',grade:2,Fy:325,E:200000,\n  secType:'rolled',shape:6,built:[400,300,10,16],box:[300,300,12],pipe:[318.5,10],custom:[11700,2.04e8,6.75e7],\n  L:4000,Ly:null,bc:'d',kb:'rec',PD:0,PL:0,selfwt:true,pj:'',mb:'C1',dz:''};\nconst EXAMPLES=[\n {key:'ex1',spec:{PD:60*TF,PL:40*TF,pj:'Example 1'}},\n {key:'ex2',spec:{units:{uf:'kN',ul:'m',ud:'mm',us:'MPa'},method:'LRFD',secType:'box',box:[300,300,12],L:3500,bc:'e',PD:300e3,PL:200e3,pj:'Example 2'}},\n {key:'ex3',spec:{units:{uf:'kip',ul:'ft',ud:'in',us:'ksi'},code:'AISC',method:'LRFD',grade:6,Fy:345,secType:'rolled',shape:7,L:14*FT,Ly:7*FT,bc:'d',PD:300*KIP,PL:200*KIP,pj:'Example 3'}},\n {key:'ex4',spec:{units:{uf:'kN',ul:'m',ud:'mm',us:'MPa'},grade:9,Fy:235,secType:'pipe',pipe:[318.5,6.9],L:5000,bc:'b',PD:250e3,PL:120e3,pj:'Example 4'}}\n];\nfunction todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\nfunction applySpec(spec,initial){\n  const S=Object.assign({},BASE,spec);S.units=Object.assign({},BASE.units,spec.units||{});\n  $('uf').value=S.units.uf;$('ul').value=S.units.ul;$('ud').value=S.units.ud;$('us').value=S.units.us;\n  if(!initial)UNIT_SNAPS.forEach(f=>f());\n  updateUnitLabels();\n  $('code').value=S.code;$('method').value=S.method;\n  $('grade').value=S.grade;setSI('Fy','stress',S.Fy);setSI('E','stress',S.E);\n  $('secType').value=S.secType;$('shape').value=S.shape;\n  ['hd','hbf','htw','htf'].forEach((id,i)=>setSI(id,'dim',S.built[i]));\n  ['bH','bB','bt'].forEach((id,i)=>setSI(id,'dim',S.box[i]));\n  ['pD','pt'].forEach((id,i)=>setSI(id,'dim',S.pipe[i]));\n  setSI('cA','area',S.custom[0]);setSI('cIx','inertia',S.custom[1]);setSI('cIy','inertia',S.custom[2]);\n  setSI('L','len',S.L);if(S.Ly==null)$('Ly').value='';else setSI('Ly','len',S.Ly);\n  $('bc').value=S.bc;$('kb').value=S.kb;setKfromBC();\n  setSI('PD','force',S.PD);setSI('PL','force',S.PL);$('selfwt').checked=S.selfwt;\n  $('pj').value=S.pj;$('mb').value=S.mb;$('dz').value=S.dz;$('dt').value=todayStr();\n  $('autoMsg').classList.add('hidden');updateSecGroups();\n}\nlet curName='',dirty=false;\nfunction showName(){const el=$('fname');el.innerHTML='— '+esc(curName||t('untitled'))+(dirty?' <span class=\"dirty\">●<\/span>':'');}\nfunction setClean(name){curName=name;dirty=false;showName();}\nfunction markDirty(){if(!dirty){dirty=true;showName();}}\nconst FIELD_IDS=['Fy','E','hd','hbf','htw','htf','bH','bB','bt','pD','pt','cA','cIx','cIy','L','Ly','Kx','Ky','PD','PL','pj','mb','dz','dt'];\nconst SELECT_IDS=['code','method','grade','secType','shape','bc','kb'];\nfunction collectState(){\n  const o={app:'steel-column-design',version:1,saved:new Date().toISOString(),lang,\n    units:{uf:$('uf').value,ul:$('ul').value,ud:$('ud').value,us:$('us').value},selects:{},fields:{},selfwt:$('selfwt').checked};\n  SELECT_IDS.forEach(id=>o.selects[id]=$(id).value);\n  FIELD_IDS.forEach(id=>o.fields[id]=$(id).value);\n  return o;\n}\nfunction restoreState(o){\n  if(!o||o.app!=='steel-column-design'||!o.units||!o.fields)throw new Error('format');\n  const setSel=(id,v)=>{if(v==null)return;const el=$(id);if([...el.options].some(op=>op.value===String(v)))el.value=String(v);};\n  ['uf','ul','ud','us'].forEach(id=>setSel(id,o.units[id]));\n  UNIT_SNAPS.forEach(f=>f());updateUnitLabels();\n  SELECT_IDS.forEach(id=>setSel(id,o.selects&&o.selects[id]));\n  FIELD_IDS.forEach(id=>{if(o.fields[id]!=null)$(id).value=o.fields[id];});\n  $('selfwt').checked=o.selfwt!==false;\n  if(o.lang&&LI[o.lang]!==undefined){lang=o.lang;$('lang').value=lang;}\n  $('autoMsg').classList.add('hidden');updateSecGroups();\n}\nfunction safeName(s){return (s||'').replace(/[\\\\/:*?\"<>|]+/g,'_').trim();}\nasync function saveProject(){\n  closeMenu();\n  const base=safeName(/\\.json$/i.test(curName)?curName.replace(/\\.json$/i,''):\n    [$('pj').value,$('mb').value].filter(Boolean).join('_'))||'Column';\n  const name=base+'.json';\n  const ok=await saveFile(name,JSON.stringify(collectState(),null,2),'application/json');\n  if(ok)setClean(name);\n  return ok;\n}\nlet pendingAction=null;\nfunction guard(action){\n  closeMenu();\n  if(!dirty){action();return;}\n  pendingAction=action;$('confirmModal').classList.remove('hidden');\n}\nfunction doNew(){applySpec({});applyLang();setClean(t('untitled'));toast(t('newDone'));}\nfunction doExample(i){applySpec(EXAMPLES[i].spec);applyLang();setClean(t(EXAMPLES[i].key).split(/[：:]/)[0]);toast(t('exLoaded'));}\nfunction doOpen(){$('fileIn').value='';$('fileIn').click();}\nfunction closeMenu(){$('fdrop').classList.add('hidden');$('btnFile').setAttribute('aria-expanded','false');}\nfunction buildExampleList(){\n  $('exList').innerHTML=EXAMPLES.map((e,i)=>`<button class=\"ex\" data-ex=\"${i}\" role=\"menuitem\"><span>${esc(t(e.key))}<\/span><small>${esc(t(e.key+'d'))}<\/small><\/button>`).join('');\n}\nfunction initFileMenu(){\n  buildExampleList();\n  $('btnFile').addEventListener('click',e=>{e.stopPropagation();const h=$('fdrop').classList.toggle('hidden');$('btnFile').setAttribute('aria-expanded',String(!h));});\n  document.addEventListener('click',e=>{if(!$('fdrop').contains(e.target))closeMenu();});\n  $('fNew').addEventListener('click',()=>guard(doNew));\n  $('fOpen').addEventListener('click',()=>guard(doOpen));\n  $('fSave').addEventListener('click',saveProject);\n  $('exList').addEventListener('click',e=>{const b=e.target.closest('[data-ex]');if(b)guard(()=>doExample(+b.dataset.ex));});\n  $('fileIn').addEventListener('change',async()=>{\n    const f=$('fileIn').files[0];if(!f)return;\n    try{const o=JSON.parse(await f.text());restoreState(o);applyLang();setClean(f.name);toast(t('opened')+f.name);}\n    catch(err){toast(t('openFail'));}\n  });\n  $('cSave').addEventListener('click',async()=>{$('confirmModal').classList.add('hidden');const a=pendingAction;pendingAction=null;if(await saveProject()&&a)a();});\n  $('cDiscard').addEventListener('click',()=>{$('confirmModal').classList.add('hidden');const a=pendingAction;pendingAction=null;if(a)a();});\n  $('cCancel').addEventListener('click',()=>{$('confirmModal').classList.add('hidden');pendingAction=null;});\n  document.querySelectorAll('aside input, aside select').forEach(el=>{el.addEventListener('input',markDirty);el.addEventListener('change',markDirty);});\n  $('btnAuto').addEventListener('click',markDirty);\n  document.addEventListener('keydown',e=>{\n    const k=e.key.toLowerCase();\n    if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();saveProject();}\n    else if((e.ctrlKey||e.metaKey)&&k==='o'){e.preventDefault();guard(doOpen);}\n    else if(e.altKey&&k==='n'){e.preventDefault();guard(doNew);}\n    else if(k==='escape'){closeMenu();}\n  });\n}\n\n/* ============ Init ============ */\nfunction init(){\n  // grades\n  const g=$('grade');GRADES.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${r[0]} (Fy ${r[1]} MPa)`;g.appendChild(o);});\n  const oc=document.createElement('option');oc.value='custom';g.appendChild(oc);\n  const sh=$('shape');HT.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r[0];sh.appendChild(o);});\n  applySpec(EXAMPLES[0].spec,true);\n\n  bindUnit('uf',['force']);bindUnit('ul',['len']);bindUnit('ud',['dim','area','inertia']);bindUnit('us',['stress']);\n  $('lang').addEventListener('change',e=>{lang=e.target.value;applyLang();});\n  $('grade').addEventListener('change',()=>{const v=$('grade').value;if(v!=='custom')setSI('Fy','stress',GRADES[+v][1]);render();});\n  $('Fy').addEventListener('input',()=>{$('grade').value='custom';});\n  $('secType').addEventListener('change',()=>{updateSecGroups();$('autoMsg').classList.add('hidden');render();});\n  $('bc').addEventListener('change',()=>{setKfromBC();render();});\n  $('kb').addEventListener('change',()=>{setKfromBC();render();});\n  ['Kx','Ky'].forEach(id=>$(id).addEventListener('input',()=>{const bc=$('bc').value;if(bc!=='g'){const k=BCK[bc][$('kb').value==='theo'?0:1];if(num('Kx')!==k||num('Ky')!==k)$('bc').value='g';}}));\n  document.querySelectorAll('aside input, aside select').forEach(el=>{\n    if(['uf','ul','ud','us','bc','kb','grade','secType'].includes(el.id))return;\n    el.addEventListener('input',render);el.addEventListener('change',render);});\n  $('btnAuto').addEventListener('click',autoDesign);\n  $('btnPrint').addEventListener('click',doPrint);\n  $('btnPdf').addEventListener('click',exportPDF);\n  $('mPdf').addEventListener('click',()=>{$('printModal').classList.add('hidden');exportPDF();});\n  $('mHtml').addEventListener('click',()=>{$('printModal').classList.add('hidden');saveFile(fileBase()+'.html',printableHTML(),'text/html');});\n  $('mClose').addEventListener('click',()=>$('printModal').classList.add('hidden'));\n  initFileMenu();\n  updateSecGroups();applyLang();setClean(t('untitled'));\n}\ninit();\n<\/script>\n<\/body>\n<\/html>";</script>
<script>// ===================== 第 4 頁：鋼柱（內嵌原「鋼結構柱容許承載力分析及設計程式」） =====================
let COLW = null;
const colFrame = $('colFrame');
function colInject(html) {
  const head = `<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script>try{if(!window.claude&&window.parent&&window.parent.claude)window.claude=window.parent.claude;}catch(e){}<\/script><style>header.top{display:none!important}:root{--ink:#1d2329;--mut:#5d6670;--line:#dde1dc;--bg:#f4f5f2;--acc:#1f4e79;--ok:#2f7d4f;--ng:#b4441f}body{font-family:'Noto Sans','Noto Sans TC','Noto Sans Thai',system-ui,sans-serif;background:#f4f5f2;color:#1d2329;font-size:14px}main{grid-template-columns:minmax(380px,480px) minmax(0,1fr);gap:16px;padding:16px;max-width:none}aside{counter-reset:sec}.card{border-radius:10px;padding:14px 16px;margin-bottom:14px;border:1px solid #dde1dc}.card h2{border-left:0;padding-left:0;color:#1d2329;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0 0 10px}.card h2::before{counter-increment:sec;content:counter(sec);background:#1f4e79;color:#fff;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;flex:none}.row label{font-size:12.5px;color:#5d6670}input,select{border:1px solid #c9cec8;border-radius:6px;font-size:13px}input[type=number],.fdrop kbd{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}input:focus,select:focus{outline:2px solid #9cc0e4;border-color:#1f4e79}.btn{background:#1f4e79;border-radius:6px}.btn:hover{background:#173d61;filter:none}.hint{color:#5d6670}#report{background:transparent;border:0;border-radius:0;padding:0;font-family:'Noto Sans','Noto Sans TC','Noto Sans Thai',system-ui,sans-serif;color:#1d2329}#report .rh{border-bottom:3px solid #1f4e79}#report .rh h1{font-size:19px}#report h3{font-size:15px;color:#1d2329;border-bottom:1px solid #dde1dc}#report table{font-size:13px}#report th{background:#fafaf8;color:#5d6670;font-weight:500}#report .kv td:first-child{color:#5d6670}.hint{font-size:12px}#report td,#report th{border-bottom-color:#dde1dc}#report .num,#report .eq,#report .verdict .v{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}#report .verdict{border:1px solid #dde1dc;border-radius:8px 8px 0 0;overflow:hidden}#report .okc{color:#2f7d4f}#report .ngc{color:#b4441f}#toast{background:#1d2329;border-radius:8px}#report .blk{background:#fff;border:1px solid #dde1dc;border-radius:10px;padding:12px 18px 14px;margin-bottom:12px}#report .blk>h3:first-child{margin-top:2px}#report.pdfmode{background:#fff;padding:0}#report.pdfmode .blk{border:0;border-radius:0;margin:0;padding:2px 0 10px}</style>`;
  const tail = `<script>(function(){var N=function(){try{parent.__colChanged&&parent.__colChanged();}catch(e){}};
document.querySelectorAll('aside input, aside select').forEach(function(el){el.addEventListener('input',N);el.addEventListener('change',N);});
document.getElementById('btnAuto').addEventListener('click',function(){setTimeout(N,60);});
try{var uc=document.getElementById('uf').closest('.card');if(uc)uc.style.display='none';var cc=document.getElementById('code').closest('.card');if(cc)cc.style.display='none';var pc=document.getElementById('pj').closest('.card');if(pc)pc.style.display='none';}catch(e){}
try{var rp=document.getElementById('report');var strip=function(){rp.querySelectorAll('.meta').forEach(function(m){m.remove();});rp.querySelectorAll('.rh > div:nth-child(2)').forEach(function(m){m.remove();});};strip();new MutationObserver(strip).observe(rp,{childList:true,subtree:true});}catch(e){}
saveProject=async function(){try{return await parent.saveFile();}catch(e){return false;}};
doOpen=function(){try{parent.openFile();}catch(e){}};
doNew=function(){try{parent.newModel();}catch(e){}};
guard=function(a){a();};
})();<\/script>`;
  return html.replace('</head>', head + '</head>').replace(/<\/body>\s*<\/html>\s*$/, tail + '</body></html>');
}
// iframe 固定為可視高度、內部捲動，讓鋼柱程式的對話框與提示訊息顯示在畫面內
function colFit() { const top = Math.max(0, $('colWrap').getBoundingClientRect().top); colFrame.style.height = Math.max(560, window.innerHeight - top - 16) + 'px'; }
window.addEventListener('resize', colFit);
function colSyncLang() { if (!COLW) return; const s = COLW.document.getElementById('lang'); if (s.value !== S.lang) { s.value = S.lang; s.dispatchEvent(new COLW.Event('change')); } }
function colSyncUnits() {
  if (!COLW) return; const map = { uf: S.u.F, ul: S.u.L, ud: S.u.d, us: S.u.s };
  for (const k in map) { const el = COLW.document.getElementById(k); if (el.value !== map[k] && [...el.options].some(o => o.value === map[k])) { el.value = map[k]; el.dispatchEvent(new COLW.Event('change')); } }
}
function colSyncCode() {
  if (!COLW) return; const d = COLW.document;
  [['code', S.code || 'AISC'], ['method', S.method]].forEach(([id, v]) => { const e = d.getElementById(id); if (e && e.value !== v) { e.value = v; e.dispatchEvent(new COLW.Event('change')); } });
  try { PROJ.column = COLW.collectState(); } catch (e) { }
}
function colStatus() {
  try { const I = COLW.readSI(); if (!COLW.valid(I)) return null; const R = COLW.analyze(I); return { ratio: R.ratio, ok: R.ratio <= 1 && R.lamOK }; } catch (e) { return null; }
}
function colRestore(o) {
  if (!COLW) return;
  try { if (o) COLW.restoreState(o); else COLW.applySpec({}); } catch (e) { COLW.applySpec({}); }
  colSyncLang(); colSyncUnits(); colSyncCode(); COLW.applyLang(); colFit();
}
window.__colChanged = function () { if (!COLW) return; DIRTY = true; updTitle(); PROJ.column = COLW.collectState(); save(); renderTabs(); colFit(); };
